    function addDays(iso, d){ const t=new Date(iso+"T00:00:00"); t.setDate(t.getDate()+d); return t; }
    function revealDate(n, w){ return REVEAL_OVERRIDE[w] ? new Date(REVEAL_OVERRIDE[w]+"T00:00:00") : addDays(COURSE_START, 7*n); }
    function today(){ const p=new URLSearchParams(location.search).get("preview");
      return p ? new Date(p+"T00:00:00") : new Date(); }
    function fmt(d){ return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일"; }
    function b64utf8(s){ return decodeURIComponent(escape(atob(s))); }

    const now=today();
    const pv=new URLSearchParams(location.search).get("preview");
    if(pv){ document.getElementById("preview-banner").innerHTML =
      '<div class="preview-banner">👁 <strong>미리보기</strong>: '+fmt(now)+' 기준으로 표시 중입니다. (학생에게 보이는 실제 상태는 접속 날짜에 따라 달라집니다.)</div>'; }

    const box=document.getElementById("weeks");
    WEEKS.forEach(wk=>{
      const rd=revealDate(wk.n, wk.w);
      const open = now >= rd;
      const det=document.createElement("details"); det.className="sol-week";
      const sum=document.createElement("summary");
      sum.innerHTML = '<strong>Week '+wk.w+'</strong> · '+wk.title +
        (open ? ' <span class="badge open">공개됨</span>' : ' <span class="badge lock">🔒 '+fmt(rd)+' 공개</span>');
      det.appendChild(sum);
      const body=document.createElement("div"); body.className="sol-body";
      if(open){ body.innerHTML = b64utf8(wk.b64); }
      else { body.innerHTML = '<p class="muted-hint">이 주차의 정답은 <strong>'+fmt(rd)+'</strong>(다음 주차)에 자동으로 공개됩니다. 그때 다시 확인해 주세요.</p>'; }
      det.appendChild(body);
      box.appendChild(det);
    });
  </script>
